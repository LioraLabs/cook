[[run]]
args = ["all"]
[run.assert]
exists = ["one/out-one.txt", "two/out-two.txt"]

[[run]]
args = ["all"]
write = { "one/one-input.txt" = "one changed\n" }
[run.assert]
changed = ["one/out-one.txt"]
unchanged = ["two/out-two.txt"]

[[run]]
args = ["why", "all", "--level", "unit", "--format", "json"]
[run.assert]
# The value must be the distinct manifests from each declaring member, not
# merely proof that the dotted declaration was registered.
output_contains = [
  "one-input.txt",
  "two-input.txt",
  "f4e8583df6f5c0e28ca6e5383911c13fd026950dcb8a1734ce7ec49f481e3943",
  "27dd8ed44a83ff94d557f9fd0412ed5a8cbca69ea04922d88c01184a07300a5a",
]
output_not_contains = ["<missing>"]
