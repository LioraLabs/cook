# 1. Cold: the property holds.
[[run]]
args = ["test"]
[run.assert]
exists = ["build/gen.txt"]
equals = { "test-runs" = "x", "chore-runs" = "x" }

# 2. Warm, nothing touched. The sealed test is cached; the chore still runs.
[[run]]
args = ["test"]
[run.assert]
unchanged = ["test-runs"]
changed = ["chore-runs"]
output_contains = ["(cached)"]

# 3. The property stops holding while the barrier dep is untouched. Before the
#    fix this replayed `ok (cached)` and exited 0 — the false green §8.6 names.
[[run]]
args = ["test"]
write = { "probe.txt" = "bad\n" }
exit = 1
[run.assert]
changed = ["test-runs", "chore-runs"]
output_not_contains = ["(cached)"]

# 4. And it stays failing rather than re-replaying.
[[run]]
args = ["test"]
exit = 1
