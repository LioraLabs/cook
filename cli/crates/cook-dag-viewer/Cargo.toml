[package]
name = "cook-dag-viewer"
version.workspace = true
edition = "2021"
description = "Build-graph model and renderers for `cook dag`"

[dependencies]
cook-contracts = { path = "../cook-contracts" }
cook-cache = { path = "../cook-cache" }
cook-fingerprint = { path = "../cook-fingerprint" }
cook-engine = { path = "../cook-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
