[package]
name = "cook-engine"
version.workspace = true
edition = "2021"
description = "Walks the work-unit DAG, deciding per unit whether the cache already holds the answer"

[dependencies]
cook-contracts = { path = "../cook-contracts" }
cook-shell = { path = "../cook-shell" }
cook-probe = { path = "../cook-probe" }
cook-dag = { path = "../cook-dag" }
cook-luaotp = { path = "../cook-luaotp" }
cook-cache = { path = "../cook-cache" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
globset = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
hex = "0.4"

[dev-dependencies]
cook-contracts = { path = "../cook-contracts" }
# COOK-233 e2e: backdate CAS blob mtimes to prove touch-on-read fires.
filetime = "0.2"
