[package]
name = "cook-cache"
version.workspace = true
edition = "2024"
description = "Build artifact cache backend for the Cook build system"

[dependencies]
cook-contracts = { path = "../cook-contracts" }
cook-fingerprint = { path = "../cook-fingerprint" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
toml = "0.9"
thiserror = "1"
tracing = "0.1"
# COOK-233 — one `utimensat` per cache hit stamps the blob's mtime as the
# last-access signal LRU eviction (`cook cache gc`) sorts on.
filetime = "0.2"
# COOK-232 — `CloudConfig::resolved_cache_dir` shares the cache-dir fallback
# chain with `cook-engine::run::build_cache_ctx`; same version already used
# by cook-cli and cook-engine.
dirs = "5"
# COOK-313 / CS-0166 — xxh3_64 seals the binary recipe index payload.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# CS-0058 — sync HTTP client for CloudBackend. `tls` feature pulls rustls
# (no native OpenSSL), keeping the dependency surface minimal and
# tokio-free (CacheBackend is a sync trait, see CS-0056 §3).
ureq = { version = "2", features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# CS-0058 — HTTP server mocking for CloudBackend tests.
mockito = "1"
