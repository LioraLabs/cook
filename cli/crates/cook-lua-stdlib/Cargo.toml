[package]
name = "cook-lua-stdlib"
version.workspace = true
edition = "2021"
description = "Shared Cook Lua API surface (fs.*, path.*, cook.platform.*) used by both the register-phase and execute-phase Lua VMs"

[dependencies]
cook-cache = { path = "../cook-cache" }
# The module-loader mechanics realize the cook_contracts::layout laws
# (candidate order, memo key, diagnostics) — the stratum edge the
# constitution prescribes: Lua-touching law here, pure law one floor down.
cook-contracts = { path = "../cook-contracts" }
cook-cookfile = { path = "../cook-cookfile" }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
glob = "0.3"
serde_json = "1"
serde_yml = "0.0.12"

[dev-dependencies]
tempfile = "3"
