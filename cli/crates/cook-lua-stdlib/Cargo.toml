[package]
name = "cook-lua-stdlib"
version.workspace = true
edition = "2021"
description = "Shared Cook Lua API surface (fs.*, path.*, cook.platform.*) used by both the register-phase and execute-phase Lua VMs"

[dependencies]
cook-cookfile = { path = "../cook-cookfile" }
cook-fingerprint = { path = "../cook-fingerprint" }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
glob = "0.3"
serde_json = "1"
serde_yml = "0.0.12"

[dev-dependencies]
# Test-only: the canonical-JSON encoder the probe store uses, so the codec
# suite can pin store-byte round trips. NOT a production edge — the codec
# itself is pure mlua+serde_json.
cook-contracts = { path = "../cook-contracts" }
tempfile = "3"
