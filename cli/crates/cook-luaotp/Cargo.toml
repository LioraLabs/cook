[package]
name = "cook-luaotp"
version.workspace = true
edition = "2021"
description = "Worker pool with per-thread Lua VMs for the Cook build system"

[dependencies]
cook-cache = { path = "../cook-cache" }
cook-contracts = { path = "../cook-contracts" }
cook-shell = { path = "../cook-shell" }
cook-lua-stdlib = { path = "../cook-lua-stdlib" }
# The probe-value store and `$<key>` substitution (COOK-422). Was a
# dev-dependency while the reader lived here and only its test reached the
# writer; it is a real edge now that the reader lives with the writer.
cook-probe = { path = "../cook-probe" }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
