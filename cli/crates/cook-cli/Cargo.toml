[package]
name = "cook-cli"
version.workspace = true
edition = "2021"
description = "User-facing binary for the Cook build system"

[[bin]]
name = "cook"
path = "src/main.rs"

[lib]
name = "cook_cli"
path = "src/lib.rs"

[dependencies]
# cook-cli is the thin CLI shell. Heavy lifting lives one layer down:
# cook-plan turns the invocation into a RegisteredWorkspace plus a recipe
# edge map (parse, workspace, register phase), and cook-engine walks the
# work-unit DAG that results. cook-cli depends only on what it needs to
# render progress, watch files, and dispatch. Other crates are reached
# transitively through those crates' public APIs.
cook-lang = { path = "../cook-lang" }
cook-contracts = { path = "../cook-contracts" }
cook-progress = { path = "../cook-progress" }
cook-plan = { path = "../cook-plan" }
cook-engine = { path = "../cook-engine" }
cook-logs = { path = "../cook-logs" }
cook-graph = { path = "../cook-graph" }
# `cook modules` is a package manager whose only workspace contact is
# cook-contracts; cook-cli dispatches to it and renders nothing of its own.
cook-modules = { path = "../cook-modules" }

# `string` lets runtime-discovered recipe names be injected as clap
# subcommands for completion; without it a subcommand name must be &'static str.
clap = { version = "4", features = ["derive", "string"] }
# Dynamic completion (one Rust implementation, every shell) lives behind
# `unstable-dynamic`, so the minor version is pinned: the feature is exempt
# from clap's semver guarantees and can change in a 4.x bump.
clap_complete = { version = "~4.6", features = ["unstable-dynamic"] }
notify = "7"
glob = "0.3"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"

[features]
default = []

# Five entries left this list with `cook modules` (COOK-420). Three of them —
# `anyhow`, `base64` and `dirs` — have no remaining use anywhere in the crate
# and are gone outright; `dirs` survives only in three doc comments that talk
# ABOUT `dirs::cache_dir`, which is what nearly kept it. `toml` and `sha2` are
# down to dev-dependencies, where the tests that parse a dumped index or hash
# a fixture still want them. What is left is what a CLI shell needs — argument
# parsing, completion, file watching, globbing, and JSON — which is the
# preamble above finally being true of the manifest under it.
[dev-dependencies]
tempfile = "3"
cargo_metadata = "0.18"
walkdir = "2"
serial_test = "3"
serde_json = "1"
regex = "1"
toml = "0.8"
sha2 = "0.10"
