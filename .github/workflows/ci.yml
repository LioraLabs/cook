name: ci

# The verification gate for this repo: must go green on every push to main and
# every pull request, no path filters -- this workflow IS the gate, not an
# optimization layered on top of one.
#
# `cook test` (run below) fans out to every test unit the root Cookfile's
# imports register:
#   - cli.test        a full `cargo test` in cli/: both the cook-lang and
#                      cook-cli conformance suites, plus vendor_completeness_test.rs
#   - ts.test          tree-sitter-cook's own grammar corpus (`tree-sitter test`)
#   - ts.conformance   tree-sitter-cook checked against the Cook Standard's
#                      conformance corpus
#   - standard.lint    engine-internal Lua keyword lint over standard/
#   - standard.vitest  the renderer's own suite: the remark/rehype plugins and
#                      the slug registries they consult
#
# CI starts with no cook binary, so this workflow bootstraps one with a plain
# `cargo build` before it can run `cook test` at all (same reason release.yml
# has its own "Bootstrap cook" step).
#
# pnpm used to be deliberately absent, on the reasoning that standard.build is a
# build chore rather than a test unit and nothing else under standard/ needed a
# toolchain. standard.vitest retired that: the suite had been reachable only
# through `pnpm test`, which no recipe invoked, so it graded nothing and two
# real failures sat in it. Gating it means the gate needs pnpm and standard/'s
# node_modules, which is the cost of the suite counting at all.
#
# standard.build stays out of scope -- still a build chore, not a test unit.


on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      # ubuntu-latest ships a Rust stable toolchain; there is no install step
      # here on purpose -- if a runner image ever loses it, this must fail
      # loudly rather than silently reaching for a fallback.

      # The version is READ from package.json rather than written here. It was
      # written here, and a second copy of a pin is a pin that can drift: CI
      # would have gone on installing 0.26.11 after the repo moved, generating
      # tracked src/ with a CLI the repo no longer claims. `ts.ts-cli-pinned`
      # checks this in the run regardless, so a drift is caught either way --
      # deriving it means the check has nothing to catch.
      - name: Install tree-sitter CLI
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*"tree-sitter-cli": *"\([^"]*\)".*/\1/p' \
            tree-sitter-cook/package.json)
          if [ -z "$version" ]; then
            echo "no tree-sitter-cli pin in tree-sitter-cook/package.json" >&2
            exit 1
          fi
          npm install -g "tree-sitter-cli@$version"

      # `standard.vitest` shells out to pnpm, so the gate needs it. The version
      # is read from standard/package.json's `packageManager` field rather than
      # written here, for the same reason the tree-sitter pin is: a second copy
      # of a pin is a pin that can drift.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: standard/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: standard/pnpm-lock.yaml

      # --frozen-lockfile so a lockfile that has drifted from package.json fails
      # here rather than being silently resolved into something the tree does
      # not describe. It is the default in CI; naming it makes that legible.
      - name: Install standard/ dependencies
        shell: bash
        working-directory: standard
        run: pnpm install --frozen-lockfile

      - name: Toolchain sanity
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          tree-sitter --version
          node --version
          pnpm --version

      # `cook test` is itself a cook chore, so it needs a cook binary first.
      - name: Build cook
        shell: bash
        run: |
          set -euo pipefail
          (cd cli && cargo build --release -p cook-cli)

      - name: cook test
        shell: bash
        run: ./cli/target/release/cook test

